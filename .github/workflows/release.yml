name: Validate and Release

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dictionary against schema
        run: npx --yes ajv-cli@5 validate -s schema.json -d dictionary.json

      - name: Read version from dictionary.json
        id: version
        run: echo "value=$(jq -r .version dictionary.json)" >> $GITHUB_OUTPUT

      - name: Check whether this version is already tagged
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.value }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Dictionary v${{ steps.version.outputs.value }}
          body: |
            ## Dictionary v${{ steps.version.outputs.value }}

            **Production CDN URL (immutable):**
            ```
            https://cdn.jsdelivr.net/gh/trailofdad/morphkit-dictionary@${{ steps.version.outputs.value }}/dictionary.json
            ```

            Update `DICTIONARY_VERSION` in your SPA environment to `${{ steps.version.outputs.value }}` to consume this release.
